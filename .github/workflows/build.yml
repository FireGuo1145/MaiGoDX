name: Build MaiGoDX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Frontend
      run: |
        cd web
        npm install
        npm run build

    - name: Build Backend & Embedded App
      run: |
        go build -o maigodx .
    
    - name: Test Run / Verify Binary
      run: |
        ./maigodx --help || true
